# Environnement de STAGING isolé — pré-production pour valider avant la prod.
#
# Isolé de la prod : ports hôte distincts (3307/5001/3001) et volumes dédiés
# (_staging) → les deux stacks peuvent coexister sur une même machine sans
# conflit. Utiliser un fichier d'env dédié :
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build
#
# Ne JAMAIS pointer le staging vers la base de production.
name: coifili-staging

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-gestion_staging}
    ports:
      - "3307:3306"
    volumes:
      - db_data_staging:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./bsed
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      DB_HOST: db
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-gestion_staging}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est obligatoire}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      APP_URL: ${APP_URL:-http://localhost:3001}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SATIM_WEBHOOK_SECRET: ${SATIM_WEBHOOK_SECRET:-}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-5}
      TRUST_PROXY: ${TRUST_PROXY:-}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - uploads_data_staging:/app/uploads
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3001:3000"

volumes:
  db_data_staging:
  uploads_data_staging:
